    <script src="https://s.pageclip.co/v1/pageclip.js" charset="utf-8"></script>

    <!-- 行動端交互核心邏輯 -->
    <script>
        // 初始化載入狀態檢測 (如果是在開發平台 preview 中，會顯示測試模式)
        window.addEventListener('load', () => {
            const banner = document.getElementById('connection-banner');

const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const isPlatform = window.location.hostname.includes('google') || window.location.hostname.includes('goog');
            
            if (isPlatform) {
                banner.innerText = "平台預覽模式 🔵 填寫將會送至測試資料庫";
                banner.className = "bg-indigo-600 text-white text-[11px] sm:text-xs font-semibold py-1.5 px-4 text-center";
            } else {
                banner.innerText = "消費者網購調查 🟢 Pageclip 雲端問卷已安全就緒";
                banner.className = "bg-emerald-600 text-white text-[11px] sm:text-xs font-semibold py-1.5 px-4 text-center";
            }
            
            // 預先檢驗 Checkbox 狀態
            checkCheckboxRequired();
        });

        // 動態高亮被選取的單選/複選外框與背景，提升手機觸控流暢度
        function updateOptionStyles() {
            document.querySelectorAll('.option-label').forEach(label => {
                const input = label.querySelector('input');
                if (input && input.checked) {
                    label.classList.remove('bg-slate-50/60', 'border-slate-200/80', 'text-slate-700');
                    label.classList.add('bg-indigo-50/60', 'border-indigo-500', 'text-indigo-900', 'ring-1', 'ring-indigo-500/20');
                } else {
                    label.classList.remove('bg-indigo-50/60', 'border-indigo-500', 'text-indigo-900', 'ring-1', 'ring-indigo-500/20');
                    label.classList.add('bg-slate-50/60', 'border-slate-200/80', 'text-slate-700');
                }
            });
        }

        // 強制多選 (Checkbox) 必須至少點選一個，否則手機瀏覽器無法觸發原生 required
        function checkCheckboxRequired() {
            const group = document.getElementById('payment-checkbox-group');
            if (!group) return;
            const checked = group.querySelectorAll('input[type="checkbox"]:checked');
            const all = group.querySelectorAll('input[type="checkbox"]');
all.forEach(cb => {
                if (checked.length > 0) {
                    cb.removeAttribute('required');
                } else {
                    cb.setAttribute('required', 'required');
                }
            });
        }

        // 點選星星滿意度評分時的動態效果
        function updateStarUI(ratingValue) {
            const stars = document.querySelectorAll('.star-svg');
            stars.forEach(star => {
                const index = parseInt(star.getAttribute('data-index'));
                if (index <= ratingValue) {
                    star.classList.add('text-amber-400');
                    star.classList.remove('text-slate-300');
                } else {
                    star.classList.add('text-slate-300');
                    star.classList.remove('text-amber-400');
                }
            });

            // 更新評分文字
            const textEl = document.getElementById('rating-text');
            const desc = ['極不滿意', '不滿意', '普通', '滿意', '極為滿意'];
            textEl.innerText = `${ratingValue} 分 (${desc[ratingValue - 1]})`;
            textEl.className = "text-xs text-amber-500 font-extrabold mt-2.5";
        }
    </script>
