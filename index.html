<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TopicPoll | 行動版問卷調查</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://s.pageclip.co/v1/pageclip.css" media="screen">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght=300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent; 
        }
        /* Pageclip 讀取動畫與手機版樣式微調 */
        .pageclip-form__submit--loading {
            opacity: 0.8;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col antialiased">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="bg-indigo-600 text-white p-2 rounded-lg shadow-sm flex items-center justify-center">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                    </svg>
                </div>
                <span class="text-lg font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">行動問卷調查</span>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-md w-full mx-auto px-4 py-4">
        
        <div class="bg-white border-t-8 border-indigo-600 border border-slate-200 rounded-3xl p-5 shadow-sm mb-4">
            <h1 class="text-lg font-extrabold text-slate-900 mb-2 leading-tight">基本資料與意見反映</h1>
            <p class="text-slate-500 text-xs leading-relaxed">請填寫下方欄位，您的回覆將會透過 Pageclip 雲端服務安全地儲存與統計。</p>
        </div>

        <form action="https://send.pageclip.co/X4J8LyGM5CX4ZYCq9NV5PYs91KGJAQ8B" class="pageclip-form space-y-4" method="post">
            
            <div class="bg-white border border-slate-200 rounded-3xl p-5 shadow-sm">
                <label class="block text-sm font-bold text-slate-800 mb-3.5">
                    1. 您的姓名 <span class="text-rose-500 ml-0.5">*</span>
                </label>
                <input type="text" name="name" placeholder="請輸入姓名" required
                    class="w-full border border-slate-200 bg-slate-50 rounded-2xl px-4 py-3.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:outline-none transition-all duration-200">
            </div>

            <div class="bg-white border border-slate-200 rounded-3xl p-5 shadow-sm">
                <label class="block text-sm font-bold text-slate-800 mb-3.5">
                    2. 電子信箱 <span class="text-rose-500 ml-0.5">*</span>
                </label>
                <input type="email" name="email" placeholder="example@email.com" required
                    class="w-full border border-slate-200 bg-slate-50 rounded-2xl px-4 py-3.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:outline-none transition-all duration-200">
            </div>

            <div class="bg-white border border-slate-200 rounded-3xl p-5 shadow-sm">
                <label class="block text-sm font-bold text-slate-800 mb-3.5">
                    3. 其他建議與想法
                </label>
                <textarea name="message" rows="4" placeholder="歡迎留下您的寶貴意見..." 
                    class="w-full border border-slate-200 bg-slate-50 rounded-2xl px-4 py-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:outline-none transition-all duration-200"></textarea>
            </div>
            
            <div class="py-4">
                <button type="submit" class="pageclip-form__submit w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold py-3.5 rounded-2xl shadow-lg transition flex items-center justify-center">
                    <span>傳送回覆 (Send)</span>
                </button>
            </div>
        </form>

    </main>

    <footer class="bg-white border-t border-slate-200 py-4 mt-8">
        <div class="max-w-md mx-auto px-4 text-center text-[10px] text-slate-400">
            &copy; 本表單已整合 Pageclip 雲端資料收集技術.
        </div>
    </footer>

    <script src="https://s.pageclip.co/v1/pageclip.js" charset="utf-8"></script>
</body>
</html>
