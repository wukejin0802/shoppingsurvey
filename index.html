                    <button type="button" onclick="nextStep()" class="bg-indigo-600 text-white font-bold py-4 rounded-2xl shadow-md active:scale-95 transition">下一題</button>

    <script src="https://s.pageclip.co/v1/pageclip.js" charset="utf-8"></script>

    <script>
        let currentStep = 0;
        const totalSteps = 10; // 0 到 10，共 11 頁

        function showStep(n) {
            const steps = document.querySelectorAll(".survey-step");
            steps.forEach(s => s.classList.remove("active"));
            steps[n].classList.add("active");
            
            // 更新進度條與計數
            currentStep = n;

const progress = ((n + 1) / (totalSteps + 1)) * 100;
            document.getElementById("progress-bar").style.width = progress + "%";
            document.getElementById("step-counter").innerText = n + 1;
            
            // 捲動到頂部
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function nextStep() {
            if (validateStep()) {
                if (currentStep < totalSteps) {
                    showStep(currentStep + 1);
                }
            } else {
                alert("請完成本題再繼續下一題哦！");
            }
        }

        function prevStep() {
            if (currentStep > 0) {
                showStep(currentStep - 1);
            }
        }

        function validateStep() {
            // 介紹頁與非必填頁 (最後一頁) 不需要驗證
            if (currentStep === 0 || currentStep === 10) return true;
            
            const currentStepEl = document.querySelector(`.survey-step[data-step="${currentStep}"]`);
            const inputs = currentStepEl.querySelectorAll("input[required]");
            
            if (inputs.length === 0) return true;
            
            // 檢查 Radio 是否選取
            if (inputs[0].type === "radio") {
                return Array.from(inputs).some(input => input.checked);
            }
            
            // 檢查 Checkbox 是否至少選一個
            if (inputs[0].type === "checkbox") {
                const checked = currentStepEl.querySelectorAll('input[type="checkbox"]:checked');
                return checked.length > 0;
            }
            
            return true;
        }

        // --- 以下保留您原本的交互邏輯 ---

        window.addEventListener('load', () => {
            const banner = document.getElementById('connection-banner');
            const isPlatform = window.location.hostname.includes('google') || window.location.hostname.includes('goog');
            if (isPlatform) {
                banner.innerText = "平台預覽模式 🔵 資料將送至測試庫";

banner.className = "bg-indigo-600 text-white text-[10px] py-1 text-center font-bold";
            } else {
                banner.innerText = "消費者網購調查 🟢 Pageclip 安全就緒";
                banner.className = "bg-emerald-600 text-white text-[10px] py-1 text-center font-bold";
            }
            checkCheckboxRequired();
        });

        function updateOptionStyles() {
            document.querySelectorAll('.option-label').forEach(label => {
                const input = label.querySelector('input');
                if (input && input.checked) {
                    label.classList.add('bg-indigo-50', 'border-indigo-500', 'text-indigo-900', 'ring-1', 'ring-indigo-500/20');
                    label.classList.remove('bg-slate-50/60', 'border-slate-200');
                } else {
                    label.classList.remove('bg-indigo-50', 'border-indigo-500', 'text-indigo-900', 'ring-1', 'ring-indigo-500/20');
                    label.classList.add('bg-slate-50/60', 'border-slate-200');
                }
            });
        }

        function checkCheckboxRequired() {
            const group = document.getElementById('payment-checkbox-group');
            if (!group) return;
            const checked = group.querySelectorAll('input[type="checkbox"]:checked');
            const all = group.querySelectorAll('input[type="checkbox"]');
            all.forEach(cb => {
                if (checked.length > 0) cb.removeAttribute('required');
                else cb.setAttribute('required', 'required');
            });
        }

        function updateStarUI(val) {
            const stars = document.querySelectorAll('.star-svg');
            stars.forEach(star => {
                const idx = parseInt(star.getAttribute('data-index'));
                star.classList.toggle('text-amber-400', idx <= val);
                star.classList.toggle('text-slate-300', idx > val);
            });
 
const textEl = document.getElementById('rating-text');
            const desc = ['極不滿意', '不滿意', '普通', '滿意', '極為滿意'];
            textEl.innerText = `${val} 分 (${desc[val - 1]})`;
            textEl.className = "text-xs text-amber-500 font-extrabold mt-3";
        }
    </script>
